<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PANTHALASSA</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-text: #082f49;
      --input-bg: #0f172a;
      --code-bg: #020617;
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: rgba(239, 68, 68, 0.45);
      --error-text: #fca5a5;
      --success-text: #86efac;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2.5rem 1rem;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.65rem;
      letter-spacing: -0.02em;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .field {
      margin-bottom: 1.15rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .checkbox-row label {
      margin: 0;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--accent);
      cursor: pointer;
    }

    textarea,
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 0.65rem 0.75rem;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    textarea:focus,
    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .toggle-btn {
      padding: 0.6rem 1.15rem;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #f8fafc;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      cursor: pointer;
    }

    .toggle-btn[data-state="1"] {
      color: #450a0a;
      background: #f87171;
      border-color: #ef4444;
    }

    button[type="submit"] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
    }

    button[type="submit"]:active {
      transform: translateY(1px);
    }

    .error {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      color: var(--error-text);
      font-size: 0.92rem;
      font-weight: 500;
    }

    .output-card {
      margin-top: 1.5rem;
    }

    .output-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }

    .output-header h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    pre {
      margin: 0 0 0.75rem;
      padding: 1rem;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.55;
      color: #e2e8f0;
    }

    pre:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>PANTHALASSA</h1>
    </div>

    <div class="card">
      <form method="POST">
        <div class="field">
          <label for="text_input">Input Text</label>
          <textarea id="text_input" name="text_input" rows="3" required>{{ request.form.get("text_input", "") }}</textarea>
        </div>

        <div class="field">
          <label>Mode Selection</label>
          <input type="hidden" id="mode_flag" name="mode_flag"
                 value="{{ request.form.get('mode_flag', '0') }}" />
          <button type="button" id="mode_toggle" class="toggle-btn">
            {{ "SCORPION" if request.form.get("mode_flag", "0") == "1" else "COVEY" }}
          </button>
        </div>

        <div id="covey_input_group">
          <div class="field">
            <label for="roz_factor">RozFactor (INT)</label>
            <input id="roz_factor" name="roz_factor" type="number" step="1"
                   value="{{ request.form.get('roz_factor', '0') }}" />
          </div>

          <div class="field">
            <label for="hs_d">HsD (INT)</label>
            <input id="hs_d" name="hs_d" type="number" step="1"
                   value="{{ request.form.get('hs_d', '0') }}" />
          </div>

          <div class="field checkbox-row">
            <input id="char_len_in_hsd" name="char_len_in_hsd" type="checkbox" value="1"
                   {% if request.form.get("char_len_in_hsd") == "1" %}checked{% endif %} />
            <label for="char_len_in_hsd">Char Length in HsD (BOOL)</label>
          </div>

          <div class="field">
            <label for="cc">CC (INT)</label>
            <input id="cc" name="cc" type="number" step="1"
                   value="{{ request.form.get('cc', '0') }}" />
          </div>
        </div>

        <div class="field" id="scorpion_input_group" style="display: none;">
          <label for="scorpion_param">SCORPION Parameter</label>
          <input id="scorpion_param" name="scorpion_param" type="text"
                 placeholder="e.g. 12.25.8.2"
                 value="{{ request.form.get('scorpion_param', '') }}" />
        </div>

        <button type="submit">Run Script</button>
      </form>

      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}
    </div>

    {% if result %}
      <div class="card output-card">
        <div class="output-header">
          <h2>Output</h2>
        </div>
        <pre>{{ result.preview }}</pre>
        <pre>{{ result.stringID }}</pre>
      </div>
    {% endif %}
  </div>

  <script>
    const toggleBtn = document.getElementById("mode_toggle");
    const modeInput = document.getElementById("mode_flag");
    const coveyGroup = document.getElementById("covey_input_group");
    const scorpionGroup = document.getElementById("scorpion_input_group");
    const scorpionInput = document.getElementById("scorpion_param");

    function syncModeLabel() {
      const isScorpion = modeInput.value === "1";
      toggleBtn.textContent = isScorpion ? "SCORPION" : "COVEY";
      toggleBtn.dataset.state = isScorpion ? "1" : "0";

      coveyGroup.style.display = isScorpion ? "none" : "block";
      scorpionGroup.style.display = isScorpion ? "block" : "none";

      if (!isScorpion) {
        scorpionInput.value = "";
      }
    }

    toggleBtn.addEventListener("click", () => {
      modeInput.value = modeInput.value === "1" ? "0" : "1";
      syncModeLabel();
    });

    syncModeLabel();
  </script>
</body>
</html>
